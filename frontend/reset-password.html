<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset password - Stintlist</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0 }

        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: "DM Sans", "Segoe UI", sans-serif;
            color: #1F2430;
            background: linear-gradient(#1D2128 0 46vh, #C98A2B 46vh calc(46vh + 3px), #FAF6EE calc(46vh + 3px));
        }

        .card {
            width: 420px;
            max-width: 100%;
            background: #fff;
            border-radius: 22px;
            padding: 36px 32px;
            box-shadow: 0 24px 60px rgba(0, 0, 0, .22);
        }

        h1 {
            font-family: "Fraunces", Georgia, serif;
            font-size: 28px;
            margin-bottom: 6px;
        }

        p.sub { color: #6B6558; font-size: 14px; margin-bottom: 22px }

        input {
            width: 100%;
            padding: 14px 16px;
            font: inherit;
            font-size: 15px;
            color: #1F2430;
            background: #FAF6EE;
            border: 1px solid #E8DFCB;
            border-radius: 12px;
            outline: none;
            margin-bottom: 14px;
        }

        input:focus { border-color: #C98A2B; box-shadow: 0 0 0 3px #F5E6C8 }

        button {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 12px;
            background: #C98A2B;
            color: #1F2430;
            font: inherit;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled { opacity: .6; cursor: wait }

        .msg { margin-top: 16px; font-size: 14px; padding: 12px 14px; border-radius: 10px; display: none }
        .msg.ok { display: block; background: #DCEADF; color: #3F6B54 }
        .msg.err { display: block; background: #F6DDD5; color: #B5432A }

        a.back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #C98A2B;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>Choose a new password</h1>
        <p class="sub">Use at least 6 characters.</p>

        <form id="resetForm">
            <input type="password" id="password" placeholder="New password" autocomplete="new-password" minlength="6" required>
            <input type="password" id="confirm" placeholder="Confirm new password" autocomplete="new-password" minlength="6" required>
            <button type="submit" id="saveBtn">Save new password</button>
        </form>

        <div class="msg" id="msg" role="status"></div>

        <a class="back" href="login.html">Back to login</a>

    </div>

    <script>
        const API = "https://task-manager-backend-3nxb.onrender.com";
        const token = new URLSearchParams(location.search).get("token");
        const form = document.getElementById("resetForm");
        const btn = document.getElementById("saveBtn");
        const msg = document.getElementById("msg");

        const show = (text, ok) => { msg.textContent = text; msg.className = "msg " + (ok ? "ok" : "err"); };

        if (!token) {
            form.style.display = "none";
            show("This reset link is incomplete. Request a new one from the login page.", false);
        }

        form.addEventListener("submit", async e => {
            e.preventDefault();

            const password = document.getElementById("password").value;
            if (password !== document.getElementById("confirm").value) {
                return show("The two passwords don't match.", false);
            }

            btn.disabled = true;
            btn.textContent = "Saving...";
            msg.className = "msg";

            try {
                const r = await fetch(API + "/reset-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ token, password })
                });
                const data = await r.json().catch(() => ({}));
                show(data.message || "Something went wrong.", r.ok);

                if (r.ok) {
                    form.style.display = "none";
                    setTimeout(() => location.href = "login.html", 2500);
                    return;
                }
            } catch {
                show("Can't reach the server. Check your connection and try again.", false);
            }

            btn.disabled = false;
            btn.textContent = "Save new password";
        });
    </script>

</body>

</html>
