<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager - Login</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">📋</div>

            <h1>Task Manager</h1>
            <p class="subtitle">Manage your tasks smarter</p>

            <div class="tabs">
                <button id="loginTab" class="active">Login</button>
                <button id="signupTab">Sign Up</button>
            </div>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email address"
                    required>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required>

                <button type="submit" class="auth-button">
                    Login
                </button>

            </form>

            <form id="signupForm" style="display: none;">

                <input
                    type="text"
                    id="signupName"
                    placeholder="Full name"
                    required>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Email address"
                    required>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Password"
                    required>

                <button type="submit" class="auth-button">
                    Create Account
                </button>

            </form>

            <p id="authMessage"></p>

        </div>

    </div>

    <script src="login.js"></script>

</body>
</html>
